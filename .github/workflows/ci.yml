name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build dataplane
        working-directory: services/dataplane-go
        run: go build -o /dev/null .
      - name: Build controlplane
        working-directory: services/controlplane-go
        run: go build -o /dev/null .
      - name: Build macert
        working-directory: services/macert-exporter-go
        run: go build -o /dev/null .
